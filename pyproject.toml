[project]
name = "krayam"
version = "0.1.0"
description = "Krayam agricultural procurement platform backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "geopy>=2.4.0",
    "openai>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "SIM", "TCH"]
ignore = [
    "B008",   # FastAPI Depends() in function args (standard pattern)
    "UP042",  # str, enum.Enum (StrEnum requires Python 3.11+)
    "UP017",  # datetime.UTC (requires Python 3.11+)
    "TC002",  # Move imports to TYPE_CHECKING (runtime needed for FastAPI)
    "N815",   # mixedCase in class scope (matches API webhook payload)
]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
